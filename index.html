${w&&status(w[1])[1]==='er'?`<div class="card" style="border-color:var(--p)"><span class="tag">Recommended next activity</span><h3 style="margin-top:8px">${esc(w[0])} needs attention (${recent(w[1])}% recent accuracy)</h3><p class="mu">Your adaptive plan has already made this a High-priority topic. Take a targeted quiz, read a related discussion, or ask for help.</p><div class="row"><button class="btn" onclick="A.targ('${esc(w[0])}')">Targeted practice quiz</button><button class="btn s" onclick="A.go('mem')">See explanation</button><button class="btn g" onclick="A.go('comm')">Related discussions</button></div></div>`:''}
